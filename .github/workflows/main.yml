name: Terraform CI

on:
  push:
    branches:
      - main
  
jobs:
  terraform:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v3
        
        # FIX: Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
 

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      # Terraform Init
      - name: Terraform Init
        run: terraform init

      # Validate
      - name: Terraform Validate
        run: terraform validate

      # Plan
      - name: Terraform Plan
        run: terraform plan
         # - name: Zip Lambda function
run: |
    mkdir -p lambdas/lambda_zips
    zip -j lambdas/lambda_zips/lambda1.zip lambdas/lambda_zips/lambda1.py
    zip -j lambdas/lambda_zips/lambda2.zip lambdas/lambda_zips/lambda2.py
    zip -j lambdas/lambda_zips/lambda3.zip lambdas/lambda_zips/lambda3.py

      # Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve
